version: 2.1

workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          filters:
            branches:
              only:
              - main
          requires:
            - build
jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - run:
          name: update-npm
          command: sudo npm install -g npm
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
  deploy:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - run:
          name: deploy-applicaiton
          command: ssh -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_PUBLIC_DNS "rm -rf
            circleci-pipeline; git clone
            https://github.com/arhato/circleci-pipeline.git; source
            circleci-pipeline/deploy.sh"